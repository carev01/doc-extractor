apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    {{- include "docextractor.labels" . | nindent 4 }}
data:
  DOCEXTRACTOR_FIRECRAWL_API_URL: {{ .Values.firecrawl.apiUrl | quote }}
  DOCEXTRACTOR_WEBHOOK_BASE_URL: "http://{{ include "docextractor.backendServiceName" . }}.{{ .Release.Namespace }}.svc.cluster.local:8000"
  # pydantic-settings JSON-parses list[str] env values, so this must be a JSON array string.
  DOCEXTRACTOR_CORS_ORIGINS: {{ printf "[%q%s]" (printf "http://%s" .Values.ingress.host) (ternary (printf ",%q" (printf "https://%s" .Values.ingress.host)) "" .Values.ingress.tls.enabled) | quote }}
  DOCEXTRACTOR_LLM_FALLBACK_ENABLED: {{ .Values.llm.fallbackEnabled | quote }}
  DOCEXTRACTOR_LLM_PROVIDER: {{ .Values.llm.provider | quote }}
  DOCEXTRACTOR_LLM_BASE_URL: {{ .Values.llm.baseUrl | quote }}
  DOCEXTRACTOR_LLM_MODEL: {{ .Values.llm.model | quote }}
  DOCEXTRACTOR_LLM_MAX_TOKENS: {{ .Values.llm.maxTokens | quote }}
  DOCEXTRACTOR_DOCLING_SERVE_URL: {{ (.Values.docling | default dict).serveUrl | default "http://docling.home.lan" | quote }}
  DOCEXTRACTOR_PDF_VLM_ESCALATION_ENABLED: {{ (.Values.pdfVlm | default dict).escalationEnabled | default true | quote }}
  DOCEXTRACTOR_PDF_VLM_BASE_URL: {{ (.Values.pdfVlm | default dict).baseUrl | default "https://openrouter.ai/api/v1/chat/completions" | quote }}
  DOCEXTRACTOR_PDF_VLM_MODEL: {{ (.Values.pdfVlm | default dict).model | default "qwen/qwen3-vl-32b-instruct" | quote }}
  DOCEXTRACTOR_PDF_VLM_MAX_PAGES_PCT: {{ (.Values.pdfVlm | default dict).maxPagesPct | default 10.0 | quote }}
  DOCEXTRACTOR_PDF_VLM_MAX_CONSECUTIVE_FAILURES: {{ (.Values.pdfVlm | default dict).maxConsecutiveFailures | default 5 | quote }}
  DOCEXTRACTOR_IMAGE_VLM_ENABLED: {{ (.Values.imageVlm | default dict).enabled | default false | quote }}
  DOCEXTRACTOR_IMAGE_VLM_BASE_URL: {{ (.Values.imageVlm | default dict).baseUrl | default "https://openrouter.ai/api/v1/chat/completions" | quote }}
  DOCEXTRACTOR_IMAGE_VLM_MODEL: {{ (.Values.imageVlm | default dict).model | default "qwen/qwen3-vl-32b-instruct" | quote }}
  DOCEXTRACTOR_IMAGE_VLM_MAX_PER_RUN: {{ (.Values.imageVlm | default dict).maxPerRun | default 100 | quote }}
  DOCEXTRACTOR_IMAGE_VLM_MAX_CONSECUTIVE_FAILURES: {{ (.Values.imageVlm | default dict).maxConsecutiveFailures | default 5 | quote }}
  DOCEXTRACTOR_IMAGE_VLM_MAX_TOKENS: {{ (.Values.imageVlm | default dict).maxTokens | default 300 | quote }}
  DOCEXTRACTOR_IMAGE_MIN_DIMENSION: {{ (.Values.imageVlm | default dict).minDimension | default 100 | quote }}
  DOCEXTRACTOR_IMAGE_MIN_BYTES: {{ (.Values.imageVlm | default dict).minBytes | default 3072 | quote }}
  DOCEXTRACTOR_EXPORT_RETENTION_DAYS: {{ .Values.export.retentionDays | quote }}
  DOCEXTRACTOR_EXPORT_MAX_TOTAL_BYTES: {{ .Values.export.maxTotalBytes | quote }}
  DOCEXTRACTOR_BROWSERLESS_URL: {{ (.Values.browserless | default dict).url | default "http://browserless.browserless.svc.cluster.local:3000" | quote }}
  DOCEXTRACTOR_BROWSERLESS_WAIT_MS: {{ (.Values.browserless | default dict).waitMs | default 9000 | quote }}
  DOCEXTRACTOR_BROWSERLESS_CONCURRENCY: {{ (.Values.browserless | default dict).concurrency | default 4 | quote }}
  # API authentication (non-secret settings; the JWT + OAuth client secrets live
  # in the Secret). These are inert until auth.jwtSecret is set.
  DOCEXTRACTOR_AUTH_JWT_ALGORITHM: {{ (.Values.auth | default dict).jwtAlgorithm | default "HS256" | quote }}
  DOCEXTRACTOR_AUTH_ACCESS_TOKEN_EXPIRE_MINUTES: {{ (.Values.auth | default dict).accessTokenExpireMinutes | default 30 | quote }}
  DOCEXTRACTOR_AUTH_REFRESH_TOKEN_EXPIRE_DAYS: {{ (.Values.auth | default dict).refreshTokenExpireDays | default 7 | quote }}
  DOCEXTRACTOR_AUTH_OAUTH_REDIRECT_BASE: {{ (.Values.auth | default dict).oauthRedirectBase | default (printf "http://%s" .Values.ingress.host) | quote }}
  DOCEXTRACTOR_AUTH_GOOGLE_CLIENT_ID: {{ ((.Values.auth | default dict).google | default dict).clientId | default "" | quote }}
  DOCEXTRACTOR_AUTH_OKTA_CLIENT_ID: {{ ((.Values.auth | default dict).okta | default dict).clientId | default "" | quote }}
  DOCEXTRACTOR_AUTH_OKTA_DOMAIN: {{ ((.Values.auth | default dict).okta | default dict).domain | default "" | quote }}
