apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-frontend-nginx
  labels:
    {{- include "docextractor.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            proxy_pass http://{{ include "docextractor.backendServiceName" . }}:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 600s;
            proxy_send_timeout 60s;
        }

        location /media/ {
            proxy_pass http://{{ include "docextractor.backendServiceName" . }}:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Hashed bundles never change under a name, so cache them for good. A
        # missing one must 404 rather than fall through to index.html: served as
        # JavaScript, the HTML fallback fails with a cryptic MIME/syntax error.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # index.html names the current bundle, so it must be revalidated on every
        # load. With no Cache-Control at all, browsers cached it heuristically
        # (from Last-Modified) and kept running the previous build after a deploy.
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html;
        }
    }
