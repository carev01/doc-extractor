apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  labels:
    {{- include "docextractor.labels" . | nindent 4 }}
type: Opaque
stringData:
  DOCEXTRACTOR_DATABASE_URL: {{ include "docextractor.databaseUrl" . | quote }}
  DOCEXTRACTOR_DATABASE_URL_SYNC: {{ include "docextractor.databaseUrlSync" . | quote }}
  DOCEXTRACTOR_FIRECRAWL_API_KEY: {{ .Values.firecrawl.apiKey | quote }}
  DOCEXTRACTOR_LLM_API_KEY: {{ .Values.llm.apiKey | quote }}
  DOCEXTRACTOR_DOCLING_SERVE_API_KEY: {{ (.Values.docling | default dict).apiKey | default "" | quote }}
  DOCEXTRACTOR_PDF_VLM_API_KEY: {{ (.Values.pdfVlm | default dict).apiKey | default "" | quote }}
  DOCEXTRACTOR_IMAGE_VLM_API_KEY: {{ (.Values.imageVlm | default dict).apiKey | default "" | quote }}
  DOCEXTRACTOR_BROWSERLESS_TOKEN: {{ (.Values.browserless | default dict).token | default "" | quote }}
  DOCEXTRACTOR_SECRET_KEY: {{ .Values.secretKey | default "" | quote }}
  DOCEXTRACTOR_NOTIFY_WEBHOOK_URL: {{ .Values.notifyWebhookUrl | default "" | quote }}
  # API authentication secrets — an empty JWT secret disables auth (open API).
  DOCEXTRACTOR_AUTH_JWT_SECRET: {{ (.Values.auth | default dict).jwtSecret | default "" | quote }}
  DOCEXTRACTOR_AUTH_GOOGLE_CLIENT_SECRET: {{ ((.Values.auth | default dict).google | default dict).clientSecret | default "" | quote }}
  DOCEXTRACTOR_AUTH_OKTA_CLIENT_SECRET: {{ ((.Values.auth | default dict).okta | default dict).clientSecret | default "" | quote }}
{{- if .Values.postgres.enabled }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
{{- end }}
