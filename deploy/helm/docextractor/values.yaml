# -- Image settings (ghcr; public packages so no pull secret needed)
image:
  backend:
    repository: ghcr.io/carev01/doc-extractor-backend
    tag: latest
  frontend:
    repository: ghcr.io/carev01/doc-extractor-frontend
    tag: latest
  pullPolicy: IfNotPresent
imagePullSecrets: []   # e.g. [{ name: ghcr-creds }] if packages are private

# -- In-cluster PostgreSQL (set enabled=false to use an external DB)
postgres:
  enabled: true
  image: postgres:16-alpine
  user: docextractor
  password: docextractor_dev      # OVERRIDE in values-homelab / --set
  database: docextractor
  storageClassName: ""            # "" = cluster default; set your VMware CSI class
  storageSize: 10Gi
externalDatabaseUrl: ""           # used only when postgres.enabled=false
externalDatabaseUrlSync: ""

# -- Shared RWO storage for exports + media + uploaded PDFs
#    (written by backend/worker, served by backend)
storage:
  storageClassName: ""            # your VMware CSI (RWO) class; "" = default
  accessMode: ReadWriteOnce       # RWX later -> ReadWriteMany (then drop worker podAffinity)
  exportsSize: 5Gi
  mediaSize: 5Gi
  pdfSize: 5Gi                    # uploaded source PDFs (re-converted on each run)

# -- Export retention (scheduler purges old exports so the exports PVC can't fill)
export:
  retentionDays: 7                # purge exports older than this (0 disables age sweep)
  maxTotalBytes: "3221225472"     # 3 GiB (quoted so Helm keeps it an integer, not 3.2e+09);
                                  # evict oldest-first above this (keep < exportsSize)

# -- Firecrawl (external, already in the cluster)
firecrawl:
  apiUrl: http://firecrawl.k3s.home.lan
  apiKey: ""                      # OVERRIDE

# -- Browserless (real Chrome) — used for shadow-DOM platforms (e.g. Salesforce
# Help) whose content Firecrawl can't serialize. Token is REQUIRED for those.
browserless:
  url: http://browserless.browserless.svc.cluster.local:3000
  token: ""                       # OVERRIDE (same token the Firecrawl adapter uses)
  waitMs: 9000
  concurrency: 4

# -- Raw-HTTP content engine (statically-served docs, no render). Fetch
# concurrency and the failure-rate guard that fails a run (rather than storing a
# partial doc set) when too large a fraction of pages fail to fetch/scope.
rawHttp:
  concurrency: 8
  maxFailureRate: 0.3             # abort when > this fraction fail (after minAttempts)
  minAttempts: 10                 # don't trip the guard on tiny sources

# -- Extraction safety / behavior tuning.
extraction:
  # Auto-retry pages blocked by bot protection (Akamai/Cloudflare) when the
  # blocked fraction is at or below this % of the run's total pages. 0 disables
  # the automatic pass (manual "retry blocked pages" still works).
  blockedRetryMaxPct: 5.0
  # Guard against a collapsed TOC wiping good content: if the rebuilt TOC has
  # fewer scrapable pages than this ratio of the source's current live article
  # count, fail the run instead of mass-removing. Only enforced once a source has
  # at least tocCollapseMinPrior live articles (so new/tiny sources aren't gated).
  tocCollapseMinRatio: 0.5
  tocCollapseMinPrior: 20

# -- LLM fallback (off by default)
llm:
  fallbackEnabled: false
  provider: anthropic
  baseUrl: ""
  model: ""
  apiKey: ""
  maxTokens: 2048   # response token budget for spec derivation (reasoning models need headroom)

# -- docling-serve (PDF → Markdown conversion engine, consumed over HTTP)
docling:
  serveUrl: http://docling.home.lan
  apiKey: ""                      # X-Api-Key for docling-serve (OVERRIDE)

# -- PDF VLM escalation — re-converts low-confidence segments via docling-serve's
# VLM pipeline pointed at an OpenAI-compatible model (default OpenRouter).
pdfVlm:
  escalationEnabled: true
  baseUrl: https://openrouter.ai/api/v1/chat/completions
  model: qwen/qwen3-vl-32b-instruct
  apiKey: ""                      # OpenRouter bearer key (OVERRIDE)
  # Per-run escalation page budget as a percentage of the document's total pages
  # (rounded up, min 1 page). Scales the VLM allowance with document size.
  maxPagesPct: 10.0
  # Circuit breaker: stop escalating after this many consecutive VLM failures
  # (the shared model/pipeline is likely down).
  maxConsecutiveFailures: 5

# -- Image descriptions — describe meaningful scraped images (screenshots,
# diagrams) via an OpenAI-compatible VLM (default OpenRouter) and surface them in
# the API + delta feed. Opt-in; the worker runs the enrichment phase. Set
# enabled: true and apiKey to turn it on.
imageVlm:
  enabled: false
  baseUrl: https://openrouter.ai/api/v1/chat/completions
  model: qwen/qwen3-vl-32b-instruct
  apiKey: ""                      # OpenRouter bearer key (OVERRIDE)
  maxPerRun: 100                  # budget: max new descriptions per run
  maxConsecutiveFailures: 5       # circuit breaker: stop after N failures in a row
  maxTokens: 300                  # max output tokens per description
  concurrency: 5                  # parallel describe calls per article (1 = serial)
  # Selection thresholds — images below either are treated as decorative and skipped.
  minDimension: 100               # px (width or height)
  minBytes: 3072                  # bytes

# -- Master key for encrypting authenticated-source credentials/sessions at rest
# (Fernet, urlsafe base64). REQUIRED to enable authenticated sources; the auth
# code raises without it. Generate with:
#   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
secretKey: ""                     # OVERRIDE (never commit a real key)

# -- Generic outbound webhook for operator alerts (e.g. realm session expired
# mid-run). Blank disables. ntfy/Slack/Discord/generic.
notifyWebhookUrl: ""              # OVERRIDE (optional)

# -- API authentication (API keys + OAuth2/JWT with RBAC).
# When jwtSecret is EMPTY, auth is DISABLED and the API is open — set jwtSecret
# to require authentication on all /api routes. The first account registered
# becomes the admin (bootstrap); afterwards only an admin can create users.
# Generate a secret with:
#   python -c "import secrets; print(secrets.token_urlsafe(48))"
auth:
  jwtSecret: ""                   # OVERRIDE to enable auth (kept in the Secret)
  jwtAlgorithm: HS256
  accessTokenExpireMinutes: 30
  refreshTokenExpireDays: 7
  # External OAuth2 (optional). Redirect base is the public app URL; the callback
  # path is {base}/api/auth/oauth/{provider}/callback.
  oauthRedirectBase: ""           # e.g. https://docextractor.k3s.home.lan
  google:
    clientId: ""
    clientSecret: ""              # OVERRIDE (Secret)
  okta:
    clientId: ""
    clientSecret: ""              # OVERRIDE (Secret)
    domain: ""                    # e.g. https://your-org.okta.com

# -- Ingress (Traefik)
ingress:
  enabled: true
  className: traefik
  host: docextractor.k3s.home.lan
  tls:
    enabled: false
    secretName: docextractor-tls

# -- Replicas (backend/worker pinned to 1 due to RWO; see storage)
replicas:
  backend: 1
  worker: 1
  scheduler: 1
  frontend: 1

resources:
  backend:   { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 1Gi } }
  worker:    { requests: { cpu: 100m, memory: 512Mi }, limits: { cpu: "2", memory: 4Gi } }  # large PDFs (88MB+ docling) need headroom
  scheduler: { requests: { cpu: 50m,  memory: 128Mi }, limits: { cpu: 250m, memory: 256Mi } }
  frontend:  { requests: { cpu: 25m,  memory: 32Mi },  limits: { cpu: 100m, memory: 128Mi } }
  postgres:  { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 1Gi } }
