server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend container.
    # Because requests arrive at the same origin (port 80) the browser never
    # makes a cross-origin request, so no CORS headers are needed here.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Extractions can run for several minutes; don't time out early.
        proxy_read_timeout 600s;
        proxy_send_timeout 60s;
    }

    # Proxy article images (served by the backend's StaticFiles mount).
    location /media/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback: unknown paths serve index.html so client-side routing works.
    # Hashed bundles never change under a name, so cache them for good. A
    # missing one must 404 rather than fall through to index.html: served as
    # JavaScript, the HTML fallback fails with a cryptic MIME/syntax error.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html names the current bundle, so it must be revalidated on every
    # load. With no Cache-Control at all, browsers cached it heuristically
    # (from Last-Modified) and kept running the previous build after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
